# Явні правила AKP Monitor.
#
# Цей файл читається без програміста: тут описано, за якими правилами система
# ставить сигнали (Risk Flags), оцінює ризик невиконання заходу і пропонує
# управлінські рекомендації. Змінювати пороги може уповноважений підрозділ;
# кожна зміна файлу фіксується в git. Модель ШІ НЕ ухвалює жодних висновків
# (п. 4 Політики використання ШІ): лише ці правила або людина.

flags:
  RF1:
    title: "Прострочений захід"
    description: "Строк за програмою минув, захід не виконано"
    rule: "строк — конкретна дата ≤ кінця звітного періоду, статус не «виконано»"
    severity: high
  RF2:
    title: "Немає підтвердних матеріалів"
    description: "Статус «виконано» або «частково виконано», а підтвердних матеріалів немає"
    rule: "статус виконано/частково, кількість підтверджень = 0"
    severity: high
  RF3:
    title: "Формальне закриття"
    description: "Захід розділу 2 виконано, але індикатор повʼязаного ризику майже не змінився"
    rule: "захід R2 виконано, індикатор ризику пройшов менше ніж {formal_closure_threshold:.0%} шляху від базового до цільового значення"
    severity: high
    params:
      formal_closure_threshold: 0.10
  RF4:
    title: "Опис повторює зміст заходу"
    description: "Опис результату не містить вимірюваного показника чи посилання і повторює зміст заходу"
    rule: "статус виконано/частково; в описі немає цифр і посилань; подібність до змісту ≥ {similarity_threshold} (Жаккар на основах слів)"
    severity: medium
    params:
      similarity_threshold: 0.6
      min_word_len: 4
      stem_len: 5
  RF5:
    title: "Показник не досягнуто"
    description: "Фактичне значення індикатора виконання нижче цільового"
    rule: "статус виконано/частково, строк настав або захід постійний, факт < ціль"
    severity: medium
  RF6:
    title: "Повторні порушення строків"
    description: "Строк заходу переносили двічі і більше або в підрозділі два і більше прострочені заходи"
    rule: "перенесень ≥ {max_postponements}, або прострочених заходів у підрозділі ≥ {max_overdue_per_unit}"
    severity: medium
    params:
      max_postponements: 2
      max_overdue_per_unit: 2
  RF7a:
    title: "Дата виконання поза періодом"
    description: "Фактична дата виконання пізніша за кінець звітного періоду"
    rule: "фактична дата > кінця звітного періоду"
    severity: medium
  RF7b:
    title: "Підтвердження «заднім числом»"
    description: "Усі підтвердні документи датовано пізніше за фактичну дату виконання"
    rule: "захід із датою; дата кожного документа > фактичної дати виконання"
    severity: medium
  RF7c:
    title: "Немає пояснення причин невиконання"
    description: "Захід не виконано, а пояснення причин немає (поле обовʼязкове на Порталі)"
    rule: "стан на Порталі «Не виконано», опис порожній"
    severity: high
  RF7d:
    title: "Ризик без заходів"
    description: "Ризик високого або критичного рівня без жодного заходу впливу"
    rule: "рівень ризику високий/критичний, заходів 0"
    severity: high
  RF7e:
    title: "Зайвий опис"
    description: "Опис заповнено для заходу, строк якого не настав (на Порталі такий опис не заповнюється)"
    rule: "стан «Строк виконання заходу не настав», опис заповнено"
    severity: low

# Ризик невиконання заходу: сума балів за явними ознаками.
# Рівень: 0 — низький, 1–2 — середній, ≥3 — високий.
nonexecution_risk:
  overdue: {points: 3, text: "строк за програмою минув, захід не виконано"}
  due_soon_not_started: {points: 2, text: "до строку ≤ {due_soon_days} днів, захід не розпочато"}
  due_soon_in_progress: {points: 1, text: "до строку ≤ {due_soon_days} днів, захід у роботі"}
  postponed_once: {points: 1, text: "строк переносили один раз"}
  postponed_twice: {points: 2, text: "строк переносили двічі і більше"}
  unit_has_overdue: {points: 1, text: "у підрозділі вже є прострочені заходи"}
  no_entry: {points: 1, text: "виконавець не вніс інформацію за період"}
  params:
    due_soon_days: 30
    high_from: 3
    medium_from: 1

# Генерація управлінських рекомендацій. Рекомендація лише ПРОПОНУЄТЬСЯ;
# рішення ухвалює уповноважена особа або керівник, призначаючи відповідального і строк.
recommendations:
  REC-UNIT-OVERDUE:
    when: "у підрозділі ≥ 2 прострочені заходи (RF6)"
    priority: 1
    action: "Провести робочу нараду з керівником підрозділу «{unit}» щодо прострочених заходів {measures}; затвердити графік їх виконання."
  REC-RISK-FORMAL:
    when: "заходи щодо ризику виконано, а індикатор ризику майже не змінився (RF3)"
    priority: 1
    action: "Переглянути ефективність заходів щодо ризику {risk} «{risk_name}»: індикатор пройшов {progress} шляху до цілі. Розглянути додатковий захід або зміну підходу під час перегляду програми."
  REC-RISK-UNCOVERED:
    when: "ризик високого/критичного рівня без заходів (RF7d)"
    priority: 1
    action: "Ініціювати внесення до програми заходу щодо усунення ризику {risk} «{risk_name}» (рівень «{level}»)."
  REC-EVIDENCE:
    when: "виконані заходи без підтверджень або з підтвердженнями «заднім числом» (RF2, RF7b)"
    priority: 2
    action: "Витребувати у підрозділу «{unit}» підтвердні матеріали щодо заходів {measures} до погодження звіту."
  REC-DESCRIPTION:
    when: "описи результату неприйнятні для Порталу (RF4, RF7c, RF7e)"
    priority: 2
    action: "Повернути на доопрацювання описи результату заходів {measures}: додати вимірюваний результат, посилання або пояснення причин."
  REC-INDICATOR:
    when: "показник виконання не досягнуто (RF5)"
    priority: 2
    action: "Проаналізувати причини недосягнення цільового значення індикатора за заходами {measures}; за потреби змінити статус на «частково виконано»."
  REC-POSTPONED:
    when: "строк заходу переносили ≥ 2 разів (RF6)"
    priority: 2
    action: "Розглянути на засіданні робочої групи доцільність подальших перенесень строку заходу {measures}; визначити причину і заходи реагування."
